version: 2
updates:
  # Maven dependencies:
  # - Keycloak major/minor bumps are ignored here because
  #   .github/workflows/new-keycloak-version.yml already opens a tested PR.
  # - Keycloak patch bumps stay enabled (no dedicated workflow yet).
  # - This pom mainly checks compile/test API compatibility. CVE patching must
  #   be done on the deployed Keycloak server, not via this extension jar.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "org.keycloak:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.keycloak.testframework:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions: group all action updates into one PR per run.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
