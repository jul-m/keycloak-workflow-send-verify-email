name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  checks: write
  contents: write

jobs:
  build-tests:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Enforce version on managed branches
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |  # shell
          # Enforce version on managed branches
          branch="${HEAD_REF:-$REF_NAME}"
          bump=""
          case "$branch" in
            feat/*) bump="minor" ;;
            fix/*|kc-fix/*) bump="patch" ;;
          esac

          if [[ -z "$bump" ]]; then
            echo "Not a managed branch ($branch) - skipping version enforcement."
            exit 0
          fi

          expected=$(scripts/compute-next-version.sh "$bump")
          actual=$(
            grep -m1 -oE '<project-version>[0-9]+\.[0-9]+\.[0-9]+</project-version>' pom.xml |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
          )
          scripts/render-readme-compat-table.sh

          if [[ "$expected" == "$actual" ]] && git diff --quiet -- README.md README.fr.md; then
            echo "Version already up to date ($actual)."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" && -n "$HEAD_REPO" && "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error::Versions in branch files require update" \
              "(pom.xml has $actual, expected $expected for a $bump bump)." \
              "This is fixed automatically when ci.yml runs on your fork, which has write access there." \
              "Make sure GitHub Actions is enabled on your fork (Actions tab), push again, then update this PR."
            exit 1
          fi

          sed -i -E "s/(<project-version>)[0-9]+\.[0-9]+\.[0-9]+(<\/project-version>)/\1${expected}\2/" pom.xml
          sed -i -E "s/(<revision>)[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT(<\/revision>)/\1${expected}-SNAPSHOT\2/" pom.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add pom.xml README.md README.fr.md
          git commit -m "ci(versionning): bump version to $expected"
          git push origin "$branch"
          echo "Bumped version from $actual to $expected and pushed to $branch."

      - name: Check pom.xml / kc-versions.sh are in sync
        run: scripts/check-pom-kc-versions-sync.sh

      - name: Build and test (unit + integration)
        id: build-tests
        run: scripts/build-tests.sh all

      - name: Create check-runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |  # shell
          # Create a check-run for the new Keycloak version test result
          CURRENT_SHA=$(git rev-parse HEAD)
          gh api -X POST /repos/${{ github.repository }}/check-runs \
            -F name="Build & Tests Results" -F head_sha=$CURRENT_SHA -F status=completed \
            -F conclusion=$([ "${{ steps.build-tests.outcome }}" == "success" ] && echo "success" || echo "failure")
