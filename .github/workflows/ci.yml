name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      # Checks out the actual branch (not the synthetic pre-merge ref pull_request
      # events default to) so the version-enforcement step below can commit and push
      # to it directly.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # feat/*, fix/* and kc-fix/* branches carry the extension's real next version,
      # committed into pom.xml (and the READMEs) rather than injected transiently -
      # see docs/CONTRIBUTING.md. This only works where the token has write access:
      # a same-repo branch/PR, or a fork running this on its own push. For a genuine
      # cross-repo fork PR (read-only token) a mismatch means the fork hasn't picked
      # up the fix yet - fail with an actionable message instead of trying to push.
      - name: Enforce version on managed branches
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="${HEAD_REF:-$REF_NAME}"

          bump=""
          case "$branch" in
            feat/*) bump="minor" ;;
            fix/*|kc-fix/*) bump="patch" ;;
          esac

          if [[ -z "$bump" ]]; then
            echo "Not a managed branch ($branch) - skipping version enforcement."
            exit 0
          fi

          expected=$(bash scripts/compute-next-version.sh "$bump")
          actual=$(grep -m1 -oE '<project-version>[0-9]+\.[0-9]+\.[0-9]+</project-version>' pom.xml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          bash scripts/render-readme-compat-table.sh
          if [[ "$expected" == "$actual" ]] && git diff --quiet -- README.md README.fr.md; then
            git checkout -- README.md README.fr.md
            echo "Version already up to date ($actual)."
            exit 0
          fi

          is_fork_readonly=false
          if [[ "$EVENT_NAME" == "pull_request" && -n "$HEAD_REPO" && "$HEAD_REPO" != "$BASE_REPO" ]]; then
            is_fork_readonly=true
          fi

          if [[ "$is_fork_readonly" == "true" ]]; then
            git checkout -- README.md README.fr.md
            echo "::error::This branch's version is out of date (pom.xml has $actual, expected $expected for a $bump bump). This is fixed automatically when ci.yml runs on your fork, which has write access there - make sure GitHub Actions is enabled on your fork (Actions tab), push again, then update this PR."
            exit 1
          fi

          sed -i -E "s/(<project-version>)[0-9]+\.[0-9]+\.[0-9]+(<\/project-version>)/\1${expected}\2/" pom.xml
          sed -i -E "s/(<revision>)[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT(<\/revision>)/\1${expected}-SNAPSHOT\2/" pom.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add pom.xml README.md README.fr.md
          git commit -m "chore: bump version to $expected"
          git push origin "$branch"
          echo "Bumped version to $expected and pushed to $branch."

      - name: Check pom.xml / kc-versions.sh are in sync
        run: bash scripts/check-pom-kc-versions-sync.sh

      - name: Build and test (unit + integration)
        run: bash scripts/build-tests.sh
