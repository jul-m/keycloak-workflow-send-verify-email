name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      # CodeQL only needs a successful compile to build its semantic database,
      # not the full unit+integration test suite (ci.yml already runs that on
      # every push/PR) - reusing scripts/build-tests.sh here doubled CI time
      # and let a flaky integration test block the security scan.
      - name: Build (compile only)
        run: |
          set -euo pipefail
          kc_version="$(bash scripts/kc-versions.sh max).0"
          mvn --batch-mode --no-transfer-progress -Dkeycloak.version="$kc_version" clean compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
