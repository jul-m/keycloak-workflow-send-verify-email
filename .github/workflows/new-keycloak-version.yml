name: New Keycloak version

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: Force-check a specific Keycloak minor version (e.g. 26.8) instead of auto-detecting new releases
        required: false
        default: ""
        type: string

permissions:
  actions: write
  checks: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  new-keycloak-version:
    name: Detect and test new Keycloak releases
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Find candidate Keycloak versions
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED_VERSION: ${{ inputs.keycloak_version }}
        run: |  # shell
          # Find the next candidate Keycloak version
          if [[ -n "$FORCED_VERSION" ]]; then
            if [[ ! "$FORCED_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid Keycloak version: $FORCED_VERSION (expected format: XX.Y)"
              exit 2
            fi
            versions=$(jq -cn --arg version "$FORCED_VERSION" '[$version]')
          else
            current_max=$(scripts/kc-versions.sh max)
            echo "Current max supported version: $current_max"
            releases=$(gh api repos/keycloak/keycloak/releases --paginate \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
            versions=$(printf '%s\n' "$releases" | jq -Rsc --arg max "$current_max" '
              ($max | split(".") | map(tonumber)) as $current |
              split("\n") |
              map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) |
                split(".")[0:2] | map(tonumber)) |
              unique | sort | map(select(. > $current) | map(tostring) | join("."))
            ')
          fi
          {
            echo "versions=$versions"
            echo "new_version=$(jq -r 'last // ""' <<< "$versions")"
            echo "version_label=$(jq -r 'join(", ")' <<< "$versions")"
          } >> "$GITHUB_OUTPUT"
          echo "Candidate Keycloak versions: $versions"

      - name: Check if a branch already exists for this batch
        id: guard
        if: steps.candidate.outputs.new_version != ''
        env:
          VERSION: ${{ steps.candidate.outputs.new_version }}
        run: |  # shell
          # Get existing branch for this version
          if git ls-remote --exit-code --heads origin "kc-support/$VERSION" "kc-fix/$VERSION" > /dev/null 2>&1; then
            echo "A branch already exists for the batch ending at Keycloak $VERSION - nothing to do this run."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" != 2 ]]; then
              echo "::error::Could not check existing Keycloak branches (git exited with $status)."
              exit "$status"
            fi
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration tests against all candidate versions
        id: test
        if: steps.candidate.outputs.new_version != '' && steps.guard.outputs.proceed == 'true'
        env:
          VERSIONS: ${{ steps.candidate.outputs.versions }}
        run: |  # shell
          # Run integration tests against all candidate versions
          result=success
          failed_versions=()
          echo "## Keycloak compatibility results" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r version; do
            if scripts/build-tests.sh "$version"; then
              echo "Candidate version $version passed the integration tests."
              echo "- Keycloak $version: passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Candidate version $version failed the integration tests."
              echo "- Keycloak $version: failed" >> "$GITHUB_STEP_SUMMARY"
              failed_versions+=("$version")
              result=failure
            fi
          done < <(jq -r '.[]' <<< "$VERSIONS")
          failed=$(printf '%s\n' "${failed_versions[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "failed_versions=$failed" >> "$GITHUB_OUTPUT"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Create the version-bump branch
        id: branch
        if: steps.candidate.outputs.new_version != '' && steps.guard.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.candidate.outputs.new_version }}
          VERSIONS: ${{ steps.candidate.outputs.versions }}
          VERSION_LABEL: ${{ steps.candidate.outputs.version_label }}
          RESULT: ${{ steps.test.outputs.result }}
        run: |  # shell
          # Create the version-bump branch
          prefix="kc-support"
          if [[ "$RESULT" != "success" ]]; then
            prefix="kc-fix"
          fi
          branch="$prefix/$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          supported_versions=$(
            { scripts/kc-versions.sh list; jq -r '.[]' <<< "$VERSIONS"; } |
            sort -u -t. -k1,1n -k2,2n |
            awk '{printf "%s\"%s\"", separator, $0; separator=" "}'
          )
          sed -i -E "s/^SUPPORTED_KC_VERSIONS=.*/SUPPORTED_KC_VERSIONS=($supported_versions)/" scripts/kc-versions.sh
          build_version=$(scripts/kc-versions.sh max)
          sed -i -E "s/(<keycloak\.version>)[0-9]+\.[0-9]+\.[0-9]+(<\/keycloak\.version>)/\1${build_version}.0\2/" pom.xml
          scripts/render-readme-compat-table.sh
          git add pom.xml scripts/kc-versions.sh README.md README.fr.md
          git commit -m "ci(new-keycloak-version): add Keycloak versions $VERSION_LABEL as candidates"
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open a tracking issue for the failing candidates
        id: issue
        if: steps.test.outputs.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_LABEL: ${{ steps.candidate.outputs.version_label }}
          FAILED_VERSIONS: ${{ steps.test.outputs.failed_versions }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |  # shell
          # Open a tracking issue for the failing candidates
          failed_label=$(jq -r 'join(", ")' <<< "$FAILED_VERSIONS")
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "Keycloak versions $failed_label failed the automated compatibility check run by"
            echo "\`.github/workflows/new-keycloak-version.yml\` (real integration tests, not a smoke test)."
            echo "All candidate versions were tested: $VERSION_LABEL."
            echo
            echo "See the failed run for full logs: $run_url"
            echo
            echo "Branch \`$BRANCH\` already has \`pom.xml\` and \`scripts/kc-versions.sh\` updated for these"
            echo "candidate versions - the fixes (or the decision to narrow the supported range) belong"
            echo "there. See the linked pull request."
          } > issue_body.md

          number=$(gh issue create \
            --title "Keycloak compatibility checks failed: $failed_label" \
            --body-file issue_body.md | grep -oE '[0-9]+$')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open pull request (compatible, no rebuild needed)
        if: steps.test.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_LABEL: ${{ steps.candidate.outputs.version_label }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |  # shell
          {
            echo "\`scripts/build-tests.sh $VERSION\` (real integration tests via Keycloak's"
            echo "test-framework, not a smoke test) passed against Keycloak $VERSION using the"
            echo "current \`main\` source, with no code changes."
            echo
            echo "This adds all candidates to \`scripts/kc-versions.sh\`, bumps \`pom.xml\` to the highest"
            echo "supported version, and refreshes the"
            echo "compatibility tables. Merging it does **not** publish a new release: the"
            echo "already-published latest release's notes are updated automatically to"
            echo "extend the documented compatibility range."
          } > pr_body.md

          gh pr create --base main --head "$BRANCH" \
            --title "Add Keycloak $VERSION_LABEL support (validated, no rebuild)" \
            --body-file pr_body.md

      - name: Open pull request (needs a code fix)
        if: steps.test.outputs.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_LABEL: ${{ steps.candidate.outputs.version_label }}
          FAILED_VERSIONS: ${{ steps.test.outputs.failed_versions }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |  # shell
          # Open pull request when need fixes
          failed_label=$(jq -r 'join(", ")' <<< "$FAILED_VERSIONS")
          {
            echo "All candidates were tested: $VERSION_LABEL."
            echo "\`scripts/build-tests.sh <version>\` failed for Keycloak $failed_label using the"
            echo "current \`main\` source - see #$ISSUE for details."
            echo
            echo "This branch already adds every candidate to \`scripts/kc-versions.sh\` and bumps"
            echo "\`pom.xml\` to the highest supported version, so"
            echo "CI is expected to stay red here until the incompatibility is actually fixed"
            echo "(runtime reflection if only a method signature changed, or drop the version"
            echo "while keeping \`scripts/kc-versions.sh\` contiguous if it can't be made to work)."
            echo
            echo "Merging this once fixed is a real code change, so it will automatically"
            echo "trigger a new release with the next patch version."
            echo
            echo "Fixes #$ISSUE"
          } > pr_body.md

          gh pr create --base main --head "$BRANCH" --draft \
            --title "Fix Keycloak $VERSION_LABEL compatibility" \
            --body-file pr_body.md

      - name: Create check-runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status == 'success' && (steps.test.outputs.result || 'skipped') || job.status }}
        run: |  # shell
          # Create a check-run for the new Keycloak version test result
          CURRENT_SHA=$(git rev-parse HEAD)
          gh api -X POST /repos/${{ github.repository }}/check-runs \
            -F name="Build & Tests Results" -F "head_sha=$CURRENT_SHA" \
            -F status=completed -F "conclusion=$RESULT"
