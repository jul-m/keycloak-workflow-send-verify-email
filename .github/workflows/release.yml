name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0 (optional, defaults to the version in pom.xml)
        required: false
        default: ""
        type: string
      prerelease:
        description: Optional pre-release label, for example rc.1
        required: false
        default: ""
        type: string
  pull_request:
    types: [closed]

jobs:
  release:
    name: Build and publish release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       (startsWith(github.event.pull_request.head.ref, 'feat/') ||
        startsWith(github.event.pull_request.head.ref, 'fix/') ||
        startsWith(github.event.pull_request.head.ref, 'kc-fix/')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Determine release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          version=""
          prerelease=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            prerelease="$INPUT_PRERELEASE"
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" || -z "$version" ]]; then
            # ci.yml already enforced and committed this version on the branch before
            # it could pass CI and be merged - just trust what's on main now.
            version=$(grep -m1 -oE '<project-version>[0-9]+\.[0-9]+\.[0-9]+</project-version>' pom.xml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            prerelease=""
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ -n "$prerelease" ]]; then
            [[ "$prerelease" =~ ^[0-9A-Za-z.-]+$ ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Check pom.xml / kc-versions.sh are in sync
        run: bash scripts/check-pom-kc-versions-sync.sh

      - name: Validate every supported Keycloak version and build release artifact
        run: |
          set -euo pipefail
          suffix=""
          if [[ -n "${{ steps.version.outputs.prerelease }}" ]]; then
            suffix="-${{ steps.version.outputs.prerelease }}"
          fi
          # "all" validates every supported version in order (ascending, see kc-versions.sh) -
          # the last run is against the max version, i.e. the one pom.xml already builds by
          # default, and its target/*.jar is what survives (each run does `mvn clean` first)
          # and becomes the actual release artifact. Baking -Dproject-version/-Drevision into
          # every run (not just the last) is harmless since only the last one's output is kept -
          # this avoids a second full `mvn clean verify` on the max version just to relabel it.
          # No suffix on a final release: the jar is named <artifactId>-<version>.jar, not
          # <artifactId>-<version>-FINAL.jar.
          bash scripts/build-tests.sh all \
            -Dproject-version="${{ steps.version.outputs.version }}" \
            -Dbuild-suffix="$suffix" \
            -Drevision="${{ steps.version.outputs.version }}$suffix"

      - name: Compute supported Keycloak range
        id: kc_range
        run: |
          set -euo pipefail
          echo "range=$(bash scripts/kc-versions.sh range)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if [[ -n "${{ steps.version.outputs.prerelease }}" ]]; then
            tag="$tag-${{ steps.version.outputs.prerelease }}"
          fi
          jar=$(find target -maxdepth 1 -type f -name '*.jar' -print -quit)
          notes_file="$(mktemp)"
          {
            echo "**Supported Keycloak versions:** ${{ steps.kc_range.outputs.range }}"
            echo
          } > "$notes_file"
          gh release create "$tag" "$jar" \
            --title "$tag" \
            --notes-file "$notes_file" \
            --generate-notes \
            $([[ -n "${{ steps.version.outputs.prerelease }}" ]] && echo --prerelease)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify published checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jar=$(find target -maxdepth 1 -type f -name '*.jar' -print -quit)
          jar_name=$(basename "$jar")
          local_sha=$(sha256sum "$jar" | cut -d' ' -f1)
          # GitHub computes and publishes a SHA256 digest for every release asset itself
          # (UI + API .assets[].digest, GA since June 2025) - no need to also ship our own
          # redundant .sha256 file, just confirm the uploaded asset matches what we built.
          remote_digest=$(gh release view "${{ steps.publish.outputs.tag }}" --json assets \
            --jq ".assets[] | select(.name == \"$jar_name\") | .digest")
          remote_sha="${remote_digest#sha256:}"
          if [[ "$local_sha" != "$remote_sha" ]]; then
            echo "Checksum mismatch: built $local_sha, GitHub reports $remote_sha" >&2
            exit 1
          fi
          echo "Checksum verified against GitHub's asset digest: $local_sha"

      - name: Refresh README compatibility table
        run: |
          set -euo pipefail
          bash scripts/render-readme-compat-table.sh
          if git diff --quiet -- README.md README.fr.md; then
            echo "No README changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.fr.md
          git commit -m "docs: refresh Keycloak compatibility table for ${{ steps.version.outputs.version }}"
          git push

  kc-support-merge:
    name: Extend latest release's supported range (no rebuild)
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'kc-support/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update latest release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag=$(gh release view --json tagName --jq .tagName)
          range=$(bash scripts/kc-versions.sh range)
          new_line="**Supported Keycloak versions:** ${range}"
          current_notes=$(gh release view "$latest_tag" --json body --jq .body)
          if printf '%s\n' "$current_notes" | head -n1 | grep -q '^\*\*Supported Keycloak versions:\*\*'; then
            printf '%s\n' "$current_notes" | tail -n +2 > notes_rest.md
          else
            {
              echo
              printf '%s\n' "$current_notes"
            } > notes_rest.md
          fi
          { echo "$new_line"; cat notes_rest.md; } > notes.md
          gh release edit "$latest_tag" --notes-file notes.md

  sync-open-branches:
    name: Sync open managed branches with main
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge main into other open managed branches
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for prefix in feat fix kc-fix kc-support; do
            branches=$(gh pr list --state open --json headRefName --jq \
              ".[] | select(.headRefName | startswith(\"$prefix/\")) | .headRefName")
            for branch in $branches; do
              if [[ "$branch" == "$MERGED_BRANCH" ]]; then
                continue
              fi

              echo "== Syncing $branch with main =="
              ok=true
              git fetch origin "$branch" || ok=false

              if [[ "$ok" == "true" ]]; then
                git checkout -B "$branch" "origin/$branch"
                if ! git merge origin/main --no-edit; then
                  git merge --abort
                  ok=false
                fi
              fi

              if [[ "$ok" == "true" ]] && ! git push origin "$branch"; then
                ok=false
              fi

              git checkout main > /dev/null 2>&1 || true

              if [[ "$ok" == "true" ]]; then
                gh workflow run ci.yml --ref "$branch"
              else
                pr_number=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number')
                if [[ -n "$pr_number" ]]; then
                  gh pr comment "$pr_number" --body "Could not automatically merge \`main\` into this branch (fork without \"Allow edits by maintainers\", or a merge conflict). Please rebase/merge \`main\` into this branch manually."
                fi
              fi
            done
          done
