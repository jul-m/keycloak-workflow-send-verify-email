# Envoie un email de vérification lorsqu'un utilisateur est ajouté à un groupe, avec un message
# personnalisé.
#
# À appliquer avec :
#   curl -X POST "https://keycloak.example.com/admin/realms/myrealm/workflows" \
#     -H "Authorization: Bearer $TOKEN" \
#     -H "Content-Type: application/yaml" \
#     --data-binary @example1.fr.yml
#
# Voir ../../README.fr.md pour la référence complète des paramètres et des variables.
name: Onboarding new users
on: user-group-membership-added
steps:
  - uses: send-verify-email
    with:
      message: |-
        <p>Bonjour ${user.firstName} ${user.lastName}, </p>

        <p>Bienvenue sur ${realm.displayName} !</p>

        <p>Vérifiez votre adresse ici : ${link}</p>

        <p>
           Cordialement,<br/>
           L'équipe ${realm.displayName}
        </p>
